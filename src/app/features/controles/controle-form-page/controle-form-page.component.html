<p-toast></p-toast>

<div class="card" style="max-width: 720px;">
    <div class="flex align-items-center gap-3 mb-4">
        <button pButton type="button" icon="pi pi-arrow-left" class="p-button-text p-button-rounded" (click)="annuler()"></button>
        <h5 class="m-0">Nouveau contrôle</h5>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="p-fluid">
        <div class="formgrid grid">
            <div class="field col-12 md:col-6">
                <label for="dateControle">Date de début *</label>
                <p-calendar id="dateControle" formControlName="dateControle" dateFormat="dd/mm/yy" [showIcon]="true" [class.ng-dirty]="form.controls.dateControle.touched"></p-calendar>
                <small class="p-error" *ngIf="form.controls.dateControle.invalid && form.controls.dateControle.touched">Ce champ est requis.</small>
            </div>
            <div class="field col-12 md:col-6">
                <label for="dateFin">Date de fin</label>
                <p-calendar id="dateFin" formControlName="dateFin" dateFormat="dd/mm/yy" [showIcon]="true"></p-calendar>
            </div>
        </div>

        <div class="field">
            <label for="controleTiersId">Contrôleur tiers</label>
            <p-dropdown
                id="controleTiersId"
                [options]="controleTiersListe"
                formControlName="controleTiersId"
                optionLabel="nom"
                optionValue="id"
                placeholder="Aucun (contrôle interne)"
                [showClear]="true"
            ></p-dropdown>
        </div>

        <div class="field">
            <label for="remarques">Remarques</label>
            <textarea id="remarques" pInputTextarea formControlName="remarques" rows="4"></textarea>
        </div>

        <div class="field-checkbox">
            <p-checkbox id="termine" [binary]="true" formControlName="termine"></p-checkbox>
            <label for="termine" class="ml-2">Contrôle terminé</label>
        </div>

        <div class="flex justify-content-end gap-2 mt-4">
            <button pButton type="button" label="Annuler" class="p-button-text" (click)="annuler()"></button>
            <button pButton type="submit" label="Enregistrer" icon="pi pi-check" [loading]="saving"></button>
        </div>
    </form>
</div>
