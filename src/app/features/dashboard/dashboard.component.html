<div class="grid">
    <div class="col-12 md:col-4">
        <div class="card mb-0">
            <app-stat-tile
                [label]="'menu.chantiers' | translate"
                [value]="chargement ? '—' : (statChantiers?.total ?? 0)"
                icon="map"
                color="blue"
            ></app-stat-tile>
            <div class="mt-3 text-500 text-sm" *ngIf="!chargement && statChantiers as s">
                <span class="text-green-600 font-medium">{{ s.actifs }} actif(s)</span>
                <span *ngIf="s.inactifs > 0"> · {{ s.inactifs }} inactif(s)</span>
            </div>
        </div>
    </div>

    <div class="col-12 md:col-4">
        <div class="card mb-0">
            <app-stat-tile
                [label]="'menu.entreprises' | translate"
                [value]="chargement ? '—' : (statEntreprises?.total ?? 0)"
                icon="briefcase"
                color="orange"
            ></app-stat-tile>
            <div class="mt-3 text-500 text-sm" *ngIf="!chargement && statEntreprises as s">
                <span class="text-green-600 font-medium">{{ s.actifs }} active(s)</span>
                <span *ngIf="s.inactifs > 0"> · {{ s.inactifs }} inactive(s)</span>
            </div>
        </div>
    </div>

    <div class="col-12 md:col-4">
        <div class="card mb-0">
            <app-stat-tile
                [label]="'menu.salaries' | translate"
                [value]="chargement ? '—' : (statSalaries?.total ?? 0)"
                icon="users"
                color="green"
            ></app-stat-tile>
            <div class="mt-3 text-500 text-sm" *ngIf="!chargement && statSalaries as s">
                <span class="text-green-600 font-medium">{{ s.actifs }} actif(s)</span>
                <span *ngIf="s.inactifs > 0"> · {{ s.inactifs }} inactif(s)</span>
            </div>
        </div>
    </div>
</div>

<div class="grid" *ngIf="!chargement">
    <div class="col-12 lg:col-6">
        <div class="card">
            <h6 class="mb-4">État du parc</h6>
            <p-chart type="bar" [data]="chartEtatParc" [options]="chartOptions" height="16rem"></p-chart>
        </div>
    </div>

    <div class="col-12 lg:col-6">
        <div class="card">
            <h6 class="mb-4">Salariés par type de contrat</h6>
            <p-chart type="bar" [data]="chartTypesContrat" [options]="chartOptions" height="16rem"></p-chart>
        </div>
    </div>
</div>
