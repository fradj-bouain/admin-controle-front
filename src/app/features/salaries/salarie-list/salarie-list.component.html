<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="left">
            <h5 class="m-0">Salariés</h5>
        </ng-template>
        <ng-template pTemplate="right">
            <button *ngIf="isSuperAdmin || isEntreprise" pButton type="button" icon="pi pi-plus" label="Ajouter" routerLink="/salaries/nouveau"></button>
        </ng-template>
    </p-toolbar>

    <p-table #dt [value]="salaries" [loading]="loading" [paginator]="true" [rows]="10" dataKey="id">
        <ng-template pTemplate="header">
            <tr>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Entreprise employeur</th>
                <th>Statut</th>
                <th style="width: 9rem"></th>
            </tr>
            <tr>
                <th><p-columnFilter type="text" field="nom" matchMode="contains" [showMenu]="false" placeholder="Filtrer..."></p-columnFilter></th>
                <th><p-columnFilter type="text" field="prenom" matchMode="contains" [showMenu]="false" placeholder="Filtrer..."></p-columnFilter></th>
                <th><p-columnFilter type="text" field="nomEntrepriseCalculee" matchMode="contains" [showMenu]="false" placeholder="Filtrer..."></p-columnFilter></th>
                <th>
                    <p-columnFilter field="statut" matchMode="equals" [showMenu]="false">
                        <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                            <p-dropdown [ngModel]="value" (ngModelChange)="filter($event)" [options]="[{label: 'Actif', value: 'ACTIF'}, {label: 'Inactif', value: 'INACTIF'}]" optionLabel="label" optionValue="value" placeholder="Tous" [showClear]="true" [appendTo]="'body'" styleClass="w-full"></p-dropdown>
                        </ng-template>
                    </p-columnFilter>
                </th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="loadingbody">
            <tr *ngFor="let i of [0,1,2,3,4]">
                <td colspan="12"><p-skeleton height="1.25rem"></p-skeleton></td>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-salarie>
            <tr class="cursor-pointer" [routerLink]="['/salaries', salarie.id]">
                <td>{{ salarie.nom }}</td>
                <td>{{ salarie.prenom }}</td>
                <td>{{ nomEntreprise(salarie.entrepriseEmployeurId) }}</td>
                <td><p-tag [severity]="salarie.statut === 'ACTIF' ? 'success' : 'danger'" [value]="salarie.statut"></p-tag></td>
                <td>
                    <div class="flex align-items-center gap-1 flex-nowrap">
                        <button
                            pButton
                            type="button"
                            icon="pi pi-pencil"
                            class="p-button-text p-button-rounded"
                            pTooltip="Modifier"
                            [routerLink]="['/salaries', salarie.id]"
                            (click)="$event.stopPropagation()"
                        ></button>
                        <button
                            pButton
                            type="button"
                            icon="pi pi-qrcode"
                            class="p-button-text p-button-rounded"
                            pTooltip="Carte d'identité numérique"
                            (click)="ouvrirQrCode(salarie); $event.stopPropagation()"
                        ></button>
                        <button
                            *ngIf="isSuperAdmin || isEntreprise"
                            pButton
                            type="button"
                            [icon]="salarie.statut === 'ACTIF' ? 'pi pi-ban' : 'pi pi-check'"
                            class="p-button-text p-button-rounded"
                            pTooltip="{{ salarie.statut === 'ACTIF' ? 'Désactiver' : 'Activer' }}"
                            (click)="confirmerBasculeStatut(salarie); $event.stopPropagation()"
                        ></button>
                        <button
                            *ngIf="isSuperAdmin || isEntreprise"
                            pButton
                            type="button"
                            icon="pi pi-trash"
                            class="p-button-text p-button-rounded p-button-danger"
                            pTooltip="Supprimer"
                            (click)="confirmerSuppression(salarie); $event.stopPropagation()"
                        ></button>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<app-qrcode-dialog [(visible)]="dialogQrCodeVisible" [salarie]="salarieSelectionne"></app-qrcode-dialog>
