<p-toast></p-toast>

<div class="card mb-3">
    <div class="flex align-items-center gap-3">
        <button pButton type="button" icon="pi pi-arrow-left" class="p-button-text p-button-rounded" (click)="annuler()"></button>
        <h5 class="m-0">Nouveau message</h5>
    </div>
</div>

<div class="card">
    <div class="card-head">
        <i class="pi pi-envelope"></i>
        <h6>Envoyer un message</h6>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="p-fluid">
        <div class="field">
            <label for="chantierId">Chantier</label>
            <p-dropdown
                id="chantierId"
                [options]="chantiersOptions"
                formControlName="chantierId"
                optionLabel="label"
                optionValue="id"
                [filter]="true"
                filterBy="label"
                [showClear]="true"
                placeholder="-- Sélectionner un chantier si besoin --"
            ></p-dropdown>
        </div>

        <div class="formgrid grid">
            <div class="field col-12 md:col-4">
                <label for="utilisateurIds">Utilisateurs</label>
                <p-multiSelect
                    id="utilisateurIds"
                    [options]="utilisateursOptions"
                    formControlName="utilisateurIds"
                    optionLabel="label"
                    optionValue="id"
                    [filter]="true"
                    filterBy="label"
                    placeholder="Tous ? / Aucun ?"
                    display="chip"
                ></p-multiSelect>
            </div>
            <div class="field col-12 md:col-4">
                <label for="clientIds">Clients</label>
                <p-multiSelect
                    id="clientIds"
                    [options]="clientsOptions"
                    formControlName="clientIds"
                    optionLabel="label"
                    optionValue="id"
                    [filter]="true"
                    filterBy="label"
                    placeholder="Tous ? / Aucun ?"
                    display="chip"
                ></p-multiSelect>
            </div>
            <div class="field col-12 md:col-4">
                <label for="entrepriseIds">Entreprises</label>
                <p-multiSelect
                    id="entrepriseIds"
                    [options]="entreprisesOptions"
                    formControlName="entrepriseIds"
                    optionLabel="label"
                    optionValue="id"
                    [filter]="true"
                    filterBy="label"
                    placeholder="Tous ? / Aucun ?"
                    display="chip"
                ></p-multiSelect>
            </div>
        </div>

        <div class="field-checkbox">
            <p-checkbox formControlName="copieAdmin" [binary]="true" inputId="copieAdmin"></p-checkbox>
            <label for="copieAdmin" class="ml-2">Envoyer à ADMIN-CONTROL'BTP</label>
        </div>

        <div class="field">
            <app-modele-fichier-upload [(fichierNom)]="fichierModeleNom"></app-modele-fichier-upload>
        </div>

        <div class="field">
            <label for="sujet">Sujet *</label>
            <input id="sujet" type="text" pInputText formControlName="sujet" [class.ng-dirty]="form.controls.sujet.touched" />
            <small class="p-error" *ngIf="form.controls.sujet.invalid && form.controls.sujet.touched">Ce champ est requis.</small>
        </div>

        <div class="field">
            <label for="contenu">Message *</label>
            <p-editor formControlName="contenu" [style]="{ height: '420px' }" [class.ng-dirty]="form.controls.contenu.touched"></p-editor>
            <small class="p-error" *ngIf="form.controls.contenu.invalid && form.controls.contenu.touched">Ce champ est requis.</small>
            <small class="text-500 block mt-1">Balises disponibles : [DATE], [CLIENT_NOM], [CHANTIER_NOM], [ENTREPRISE_NOM]</small>
        </div>

        <div class="flex justify-content-end gap-2 mt-4">
            <button pButton type="button" label="Annuler" class="p-button-text" (click)="annuler()"></button>
            <button pButton type="submit" label="Envoyer" icon="pi pi-send" [loading]="saving"></button>
        </div>
    </form>
</div>
