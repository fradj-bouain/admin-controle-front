<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="left">
            <h5 class="m-0">Automatisation des relances</h5>
        </ng-template>
        <ng-template pTemplate="right">
            <button pButton type="button" icon="pi pi-plus" label="Nouvelle règle" routerLink="/messagerie/automatisation/nouveau"></button>
        </ng-template>
    </p-toolbar>

    <p-table #dt [value]="regles" dataKey="id" [loading]="loading">
        <ng-template pTemplate="header">
            <tr>
                <th>Nom</th>
                <th>Événement</th>
                <th>Délai</th>
                <th>Destinataires</th>
                <th>Statut</th>
                <th></th>
            </tr>
            <tr>
                <th><p-columnFilter type="text" field="nom" matchMode="contains" [showMenu]="false" placeholder="Filtrer..."></p-columnFilter></th>
                <th></th>
                <th></th>
                <th></th>
                <th>
                    <p-columnFilter field="actif" matchMode="equals" [showMenu]="false">
                        <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                            <p-dropdown [ngModel]="value" (ngModelChange)="filter($event)" [options]="[{label: 'Active', value: true}, {label: 'Inactive', value: false}]" optionLabel="label" optionValue="value" placeholder="Tous" [showClear]="true" [appendTo]="'body'" styleClass="w-full"></p-dropdown>
                        </ng-template>
                    </p-columnFilter>
                </th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-regle>
            <tr>
                <td>{{ regle.nom }}</td>
                <td>{{ evenementLabels[regle.champSurveillableId] }}</td>
                <td>{{ regle.nbJoursAvant }} jour(s) avant</td>
                <td>{{ cibleLabels[regle.cibleGroupe] }}</td>
                <td><p-tag [severity]="regle.actif ? 'success' : 'danger'" [value]="regle.actif ? 'ACTIVE' : 'INACTIVE'"></p-tag></td>
                <td>
                    <div class="flex align-items-center gap-1 flex-nowrap">
                        <button
                            pButton
                            type="button"
                            icon="pi pi-pencil"
                            class="p-button-text p-button-rounded"
                            pTooltip="Modifier"
                            [routerLink]="['/messagerie/automatisation', regle.id]"
                        ></button>
                        <button
                            pButton
                            type="button"
                            [icon]="regle.actif ? 'pi pi-ban' : 'pi pi-check'"
                            class="p-button-text p-button-rounded"
                            [pTooltip]="regle.actif ? 'Désactiver' : 'Activer'"
                            (click)="confirmerBasculeStatut(regle)"
                        ></button>
                        <button
                            pButton
                            type="button"
                            icon="pi pi-trash"
                            class="p-button-text p-button-rounded p-button-danger"
                            pTooltip="Supprimer"
                            (click)="confirmerSuppression(regle)"
                        ></button>
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr><td colspan="6" class="text-center text-500">Aucune règle d'automatisation.</td></tr>
        </ng-template>
    </p-table>
</div>
