<p-toast></p-toast>

<div class="card" style="max-width: 720px;">
    <div class="flex align-items-center gap-3 mb-4">
        <button pButton type="button" icon="pi pi-arrow-left" class="p-button-text p-button-rounded" (click)="annuler()"></button>
        <h5 class="m-0">Planifier un envoi</h5>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="p-fluid">
        <div class="field">
            <label for="cibleGroupe">Destinataires *</label>
            <p-dropdown id="cibleGroupe" [options]="ciblesGroupe" formControlName="cibleGroupe" optionLabel="label" optionValue="value" [class.ng-dirty]="form.controls.cibleGroupe.touched"></p-dropdown>
            <small class="p-error" *ngIf="form.controls.cibleGroupe.invalid && form.controls.cibleGroupe.touched">Ce champ est requis.</small>
        </div>

        <div class="formgrid grid" *ngIf="estSpecifique">
            <div class="field col-12 md:col-6">
                <label for="destinataireType">Type *</label>
                <p-dropdown id="destinataireType" [options]="types" formControlName="destinataireType"></p-dropdown>
            </div>
            <div class="field col-12 md:col-6">
                <label for="destinataireId">Destinataire *</label>
                <p-dropdown
                    id="destinataireId"
                    [options]="destinatairesDisponibles"
                    formControlName="destinataireId"
                    optionLabel="label"
                    optionValue="id"
                    [filter]="true"
                    filterBy="label"
                    placeholder="Sélectionner"
                    [class.ng-dirty]="form.controls.destinataireId.touched"
                ></p-dropdown>
                <small class="p-error" *ngIf="form.controls.destinataireId.invalid && form.controls.destinataireId.touched">Ce champ est requis.</small>
            </div>
        </div>

        <div class="field">
            <label for="dateEnvoiPrevue">Date et heure d'envoi *</label>
            <p-calendar id="dateEnvoiPrevue" formControlName="dateEnvoiPrevue" [showTime]="true" dateFormat="dd/mm/yy" appendTo="body" [class.ng-dirty]="form.controls.dateEnvoiPrevue.touched"></p-calendar>
            <small class="p-error" *ngIf="form.controls.dateEnvoiPrevue.invalid && form.controls.dateEnvoiPrevue.touched">Ce champ est requis.</small>
        </div>

        <div class="field">
            <label for="sujet">Sujet *</label>
            <input id="sujet" type="text" pInputText formControlName="sujet" [class.ng-dirty]="form.controls.sujet.touched" />
            <small class="p-error" *ngIf="form.controls.sujet.invalid && form.controls.sujet.touched">Ce champ est requis.</small>
        </div>

        <div class="field">
            <label for="contenu">Message *</label>
            <textarea id="contenu" pInputTextarea formControlName="contenu" rows="6" [class.ng-dirty]="form.controls.contenu.touched"></textarea>
            <small class="p-error" *ngIf="form.controls.contenu.invalid && form.controls.contenu.touched">Ce champ est requis.</small>
        </div>

        <div class="flex justify-content-end gap-2 mt-4">
            <button pButton type="button" label="Annuler" class="p-button-text" (click)="annuler()"></button>
            <button pButton type="submit" label="Planifier" icon="pi pi-clock" [loading]="saving"></button>
        </div>
    </form>
</div>
