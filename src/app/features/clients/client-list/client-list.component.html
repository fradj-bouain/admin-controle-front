<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="left">
            <h5 class="m-0">Clients</h5>
        </ng-template>
        <ng-template pTemplate="right">
            <button *ngIf="isSuperAdmin" pButton type="button" icon="pi pi-plus" label="Ajouter" routerLink="/clients/nouveau"></button>
        </ng-template>
    </p-toolbar>

    <div class="flex align-items-center justify-content-between mb-2 flex-wrap gap-2">
        <span class="p-input-icon-left w-full md:w-25rem">
            <i class="pi pi-search"></i>
            <input
                type="text"
                pInputText
                placeholder="Rechercher un client (nom, ville, email...)"
                class="w-full"
                (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            />
        </span>
        <button pButton type="button" [label]="afficherFiltresAvances ? 'Masquer les filtres avancés' : 'Filtres avancés'" [icon]="afficherFiltresAvances ? 'pi pi-chevron-up' : 'pi pi-chevron-down'" class="p-button-text p-button-sm" (click)="afficherFiltresAvances = !afficherFiltresAvances"></button>
    </div>
    <p class="text-500 text-sm mt-0 mb-3">{{ (dt.filteredValue ?? clients).length }} résultat(s)</p>

    <p-table #dt [value]="clients" [loading]="loading" [paginator]="true" [rows]="25" [rowsPerPageOptions]="[25,50,150]" dataKey="id" [globalFilterFields]="['raisonSociale','ville','telephone','email']">
        <ng-template pTemplate="header">
            <tr>
                <th>Raison sociale</th>
                <th>Ville</th>
                <th>Téléphone</th>
                <th>Email</th>
                <th>Statut</th>
                <th style="width: 4rem"></th>
            </tr>
            <tr *ngIf="afficherFiltresAvances">
                <th><p-columnFilter type="text" field="raisonSociale" matchMode="contains" [showMenu]="false" placeholder="Filtrer..."></p-columnFilter></th>
                <th><p-columnFilter type="text" field="ville" matchMode="contains" [showMenu]="false" placeholder="Filtrer..."></p-columnFilter></th>
                <th><p-columnFilter type="text" field="telephone" matchMode="contains" [showMenu]="false" placeholder="Filtrer..."></p-columnFilter></th>
                <th><p-columnFilter type="text" field="email" matchMode="contains" [showMenu]="false" placeholder="Filtrer..."></p-columnFilter></th>
                <th>
                    <p-columnFilter field="actif" matchMode="equals" [showMenu]="false">
                        <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                            <p-dropdown [ngModel]="value" (ngModelChange)="filter($event)" [options]="[{label: 'Actif', value: true}, {label: 'Inactif', value: false}]" optionLabel="label" optionValue="value" placeholder="Tous" [showClear]="true" [appendTo]="'body'" styleClass="w-full"></p-dropdown>
                        </ng-template>
                    </p-columnFilter>
                </th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="loadingbody">
            <tr *ngFor="let i of [0,1,2,3,4]">
                <td colspan="12"><p-skeleton height="1.25rem"></p-skeleton></td>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-client>
            <tr class="cursor-pointer" [routerLink]="['/clients', client.id]">
                <td>{{ client.raisonSociale }}</td>
                <td>{{ client.ville }}</td>
                <td>{{ client.telephone }}</td>
                <td>{{ client.email }}</td>
                <td><p-tag [severity]="client.actif ? 'success' : 'danger'" [value]="client.actif | etatLabel"></p-tag></td>
                <td>
                    <button
                        pButton
                        type="button"
                        icon="pi pi-ellipsis-v"
                        class="p-button-text p-button-rounded"
                        pTooltip="Actions"
                        (click)="menuItems = construireMenu(client); menu.toggle($event); $event.stopPropagation()"
                    ></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center text-500 py-4">Aucun client ne correspond à cette recherche.</td>
            </tr>
        </ng-template>
    </p-table>
    <p-menu #menu [popup]="true" [model]="menuItems"></p-menu>
</div>
