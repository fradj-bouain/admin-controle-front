<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="left">
            <h5 class="m-0">Clients</h5>
        </ng-template>
        <ng-template pTemplate="right">
            <button pButton type="button" icon="pi pi-plus" label="Ajouter" routerLink="/clients/nouveau"></button>
        </ng-template>
    </p-toolbar>

    <p-table #dt [value]="clients" [loading]="loading" [paginator]="true" [rows]="10" dataKey="id">
        <ng-template pTemplate="header">
            <tr>
                <th>Raison sociale</th>
                <th>Ville</th>
                <th>Téléphone</th>
                <th>Email</th>
                <th>Statut</th>
                <th style="width: 6rem"></th>
            </tr>
            <tr>
                <th><p-columnFilter type="text" field="raisonSociale" matchMode="contains" [showMenu]="false" placeholder="Filtrer..."></p-columnFilter></th>
                <th><p-columnFilter type="text" field="ville" matchMode="contains" [showMenu]="false" placeholder="Filtrer..."></p-columnFilter></th>
                <th><p-columnFilter type="text" field="telephone" matchMode="contains" [showMenu]="false" placeholder="Filtrer..."></p-columnFilter></th>
                <th><p-columnFilter type="text" field="email" matchMode="contains" [showMenu]="false" placeholder="Filtrer..."></p-columnFilter></th>
                <th>
                    <p-columnFilter field="actif" matchMode="equals" [showMenu]="false">
                        <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                            <p-dropdown [ngModel]="value" (ngModelChange)="filter($event)" [options]="[{label: 'Actif', value: true}, {label: 'Inactif', value: false}]" optionLabel="label" optionValue="value" placeholder="Tous" [showClear]="true" [appendTo]="'body'" styleClass="w-full"></p-dropdown>
                        </ng-template>
                    </p-columnFilter>
                </th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-client>
            <tr class="cursor-pointer" [routerLink]="['/clients', client.id]">
                <td>{{ client.raisonSociale }}</td>
                <td>{{ client.ville }}</td>
                <td>{{ client.telephone }}</td>
                <td>{{ client.email }}</td>
                <td><p-tag [severity]="client.actif ? 'success' : 'danger'" [value]="client.actif ? 'ACTIF' : 'INACTIF'"></p-tag></td>
                <td>
                    <div class="flex align-items-center gap-1 flex-nowrap">
                        <button
                            pButton
                            type="button"
                            icon="pi pi-pencil"
                            class="p-button-text p-button-rounded"
                            pTooltip="Modifier"
                            [routerLink]="['/clients', client.id]"
                            (click)="$event.stopPropagation()"
                        ></button>
                        <button
                            pButton
                            type="button"
                            [icon]="client.actif ? 'pi pi-ban' : 'pi pi-check'"
                            class="p-button-text p-button-rounded"
                            [pTooltip]="client.actif ? 'Désactiver' : 'Activer'"
                            (click)="confirmerBasculeStatut(client); $event.stopPropagation()"
                        ></button>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
