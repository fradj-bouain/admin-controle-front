<p-toast></p-toast>

<p-tabView>
    <p-tabPanel header="Documents">
        <div class="card">
            <p-toolbar styleClass="mb-4">
                <ng-template pTemplate="left">
                    <div class="flex align-items-end gap-2">
                        <div class="flex flex-column gap-1">
                            <label class="text-500 text-sm">Concerne</label>
                            <p-dropdown
                                [options]="cibles"
                                [(ngModel)]="cible"
                                (ngModelChange)="onCibleChange()"
                                [style]="{ width: '10rem' }"
                            ></p-dropdown>
                        </div>
                        <div class="flex flex-column gap-1">
                            <label class="text-500 text-sm">Salarié / entreprise</label>
                            <p-dropdown
                                [options]="entitesDisponibles"
                                [(ngModel)]="entiteId"
                                (ngModelChange)="onEntiteChange()"
                                optionLabel="label"
                                optionValue="id"
                                [filter]="true"
                                filterBy="label"
                                placeholder="Sélectionner"
                                [style]="{ width: '20rem' }"
                            ></p-dropdown>
                        </div>
                    </div>
                </ng-template>
                <ng-template pTemplate="right">
                    <button
                        pButton
                        type="button"
                        icon="pi pi-plus"
                        label="Ajouter un document"
                        [disabled]="!entiteId"
                        (click)="dialogDocumentVisible = true"
                    ></button>
                </ng-template>
            </p-toolbar>

            <p-table [value]="documents" dataKey="id">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Type</th>
                        <th>Expiration</th>
                        <th>Statut</th>
                        <th style="width: 10rem"></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-document>
                    <tr>
                        <td>{{ libelleType(document.typeDocumentId) }}</td>
                        <td>{{ document.dateExpiration }}</td>
                        <td>
                            <p-tag
                                [severity]="document.statutValidation === 'VALIDE' ? 'success' : (document.statutValidation === 'REFUSE' ? 'danger' : 'warning')"
                                [value]="document.statutValidation"
                            ></p-tag>
                        </td>
                        <td>
                            <button pButton type="button" icon="pi pi-check" class="p-button-text p-button-rounded p-button-success" *ngIf="document.statutValidation !== 'VALIDE'" (click)="valider(document)"></button>
                            <button pButton type="button" icon="pi pi-times" class="p-button-text p-button-rounded p-button-danger" *ngIf="document.statutValidation !== 'REFUSE'" (click)="refuser(document)"></button>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr><td colspan="4" class="text-center text-500">{{ entiteId ? 'Aucun document.' : 'Sélectionnez un salarié ou une entreprise.' }}</td></tr>
                </ng-template>
            </p-table>
        </div>
    </p-tabPanel>

    <p-tabPanel header="Types de documents">
        <div class="card">
            <p-toolbar styleClass="mb-4">
                <ng-template pTemplate="left"><h5 class="m-0">Types de documents configurés</h5></ng-template>
                <ng-template pTemplate="right">
                    <button pButton type="button" icon="pi pi-plus" label="Ajouter" routerLink="/documents/types/nouveau"></button>
                </ng-template>
            </p-toolbar>

            <p-table [value]="types" dataKey="id">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Libellé</th>
                        <th>Cible</th>
                        <th>Format</th>
                        <th>Obligatoire</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-type>
                    <tr>
                        <td>{{ type.libelle }}</td>
                        <td>{{ type.cible }}</td>
                        <td>{{ type.format }}</td>
                        <td><p-tag *ngIf="type.obligatoire" severity="danger" value="Obligatoire"></p-tag></td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </p-tabPanel>
</p-tabView>

<app-document-form-dialog [(visible)]="dialogDocumentVisible" [typesDisponibles]="typesPourCible" (created)="creerDocument($event)"></app-document-form-dialog>
