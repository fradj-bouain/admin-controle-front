<p-toast></p-toast>

<div class="card" style="max-width: 720px;">
    <div class="flex align-items-center gap-3 mb-4">
        <button pButton type="button" icon="pi pi-arrow-left" class="p-button-text p-button-rounded" (click)="annuler()"></button>
        <h5 class="m-0">Nouvel utilisateur</h5>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="p-fluid">
        <div class="formgrid grid">
            <div class="field col-12 md:col-6">
                <label for="nom">Nom *</label>
                <input id="nom" type="text" pInputText formControlName="nom" [class.ng-dirty]="form.controls.nom.touched" />
                <small class="p-error" *ngIf="form.controls.nom.invalid && form.controls.nom.touched">Ce champ est requis.</small>
            </div>
            <div class="field col-12 md:col-6">
                <label for="prenom">Prénom *</label>
                <input id="prenom" type="text" pInputText formControlName="prenom" [class.ng-dirty]="form.controls.prenom.touched" />
                <small class="p-error" *ngIf="form.controls.prenom.invalid && form.controls.prenom.touched">Ce champ est requis.</small>
            </div>
        </div>
        <div class="field">
            <label for="email">Email *</label>
            <input id="email" type="email" pInputText formControlName="email" [class.ng-dirty]="form.controls.email.touched" />
            <small class="p-error" *ngIf="form.controls.email.hasError('required') && form.controls.email.touched">Ce champ est requis.</small>
            <small class="p-error" *ngIf="form.controls.email.hasError('email') && form.controls.email.touched">Adresse email invalide.</small>
        </div>
        <div class="field">
            <label for="username">Nom d'utilisateur *</label>
            <input id="username" type="text" pInputText formControlName="username" [class.ng-dirty]="form.controls.username.touched" />
            <small class="p-error" *ngIf="form.controls.username.invalid && form.controls.username.touched">Ce champ est requis.</small>
        </div>
        <div class="field">
            <label for="password">Mot de passe *</label>
            <input id="password" type="password" pInputText formControlName="password" [class.ng-dirty]="form.controls.password.touched" />
            <small class="p-error" *ngIf="form.controls.password.invalid && form.controls.password.touched">Ce champ est requis.</small>
        </div>
        <div class="field">
            <label for="roles">Rôles *</label>
            <p-multiSelect id="roles" [options]="roles" formControlName="roles" placeholder="Sélectionner des rôles" [class.ng-dirty]="form.controls.roles.touched"></p-multiSelect>
            <small class="p-error" *ngIf="form.controls.roles.invalid && form.controls.roles.touched">Sélectionnez au moins un rôle.</small>
        </div>
        <div class="field" *ngIf="form.value.roles?.includes('ENTREPRISE')">
            <label for="entrepriseId">Entreprise de rattachement *</label>
            <p-dropdown
                id="entrepriseId"
                [options]="entreprises"
                formControlName="entrepriseId"
                optionLabel="raisonSociale"
                optionValue="id"
                [filter]="true"
                filterBy="raisonSociale"
                placeholder="Sélectionner une entreprise"
                [class.ng-dirty]="form.controls.entrepriseId.touched"
            ></p-dropdown>
            <small class="p-error" *ngIf="form.controls.entrepriseId.invalid && form.controls.entrepriseId.touched">Ce champ est requis.</small>
        </div>
        <div class="field" *ngIf="form.value.roles?.includes('CLIENT')">
            <label for="clientId">Client de rattachement *</label>
            <p-dropdown
                id="clientId"
                [options]="clients"
                formControlName="clientId"
                optionLabel="raisonSociale"
                optionValue="id"
                [filter]="true"
                filterBy="raisonSociale"
                placeholder="Sélectionner un client"
                [class.ng-dirty]="form.controls.clientId.touched"
            ></p-dropdown>
            <small class="p-error" *ngIf="form.controls.clientId.invalid && form.controls.clientId.touched">Ce champ est requis.</small>
        </div>
        <div class="field-checkbox" *ngIf="form.value.roles?.includes('CLIENT')">
            <p-checkbox id="accesTousChantiers" formControlName="accesTousChantiers" [binary]="true"></p-checkbox>
            <label for="accesTousChantiers" class="ml-2">
                Accès à tous les chantiers du client
                <small class="block text-color-secondary">
                    Sinon, ce compte ne verra que les chantiers qui lui seront explicitement assignés
                    ("responsable de chantier").
                </small>
            </label>
        </div>
        <div class="field" *ngIf="form.value.roles?.includes('CONTROLEUR')">
            <label for="controleTiersId">Organisme de contrôle de rattachement *</label>
            <p-dropdown
                id="controleTiersId"
                [options]="controleTiersListe"
                formControlName="controleTiersId"
                optionLabel="nom"
                optionValue="id"
                [filter]="true"
                filterBy="nom"
                placeholder="Sélectionner un organisme de contrôle"
                [class.ng-dirty]="form.controls.controleTiersId.touched"
            ></p-dropdown>
            <small class="p-error" *ngIf="form.controls.controleTiersId.invalid && form.controls.controleTiersId.touched">Ce champ est requis.</small>
        </div>

        <div class="flex justify-content-end gap-2 mt-4">
            <button pButton type="button" label="Annuler" class="p-button-text" (click)="annuler()"></button>
            <button pButton type="submit" label="Enregistrer" icon="pi pi-check" [loading]="saving"></button>
        </div>
    </form>
</div>
