<p-toast></p-toast>

<div class="card" style="max-width: 720px;">
    <div class="flex align-items-center gap-3 mb-4">
        <button pButton type="button" icon="pi pi-arrow-left" class="p-button-text p-button-rounded" (click)="annuler()"></button>
        <h5 class="m-0">Nouvel utilisateur</h5>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="p-fluid">
        <div class="formgrid grid">
            <div class="field col-12 md:col-6">
                <label for="nom">Nom *</label>
                <input id="nom" type="text" pInputText formControlName="nom" />
            </div>
            <div class="field col-12 md:col-6">
                <label for="prenom">Prénom *</label>
                <input id="prenom" type="text" pInputText formControlName="prenom" />
            </div>
        </div>
        <div class="field">
            <label for="email">Email *</label>
            <input id="email" type="email" pInputText formControlName="email" />
        </div>
        <div class="field">
            <label for="username">Nom d'utilisateur *</label>
            <input id="username" type="text" pInputText formControlName="username" />
        </div>
        <div class="field">
            <label for="password">Mot de passe *</label>
            <input id="password" type="password" pInputText formControlName="password" />
        </div>
        <div class="field">
            <label for="roles">Rôles *</label>
            <p-multiSelect id="roles" [options]="roles" formControlName="roles" placeholder="Sélectionner des rôles"></p-multiSelect>
        </div>
        <div class="field" *ngIf="form.value.roles?.includes('ENTREPRISE')">
            <label for="entrepriseId">Entreprise de rattachement</label>
            <p-dropdown
                id="entrepriseId"
                [options]="entreprises"
                formControlName="entrepriseId"
                optionLabel="raisonSociale"
                optionValue="id"
                placeholder="Sélectionner une entreprise"
            ></p-dropdown>
        </div>
        <div class="field" *ngIf="form.value.roles?.includes('CLIENT')">
            <label for="clientId">Client de rattachement</label>
            <p-dropdown
                id="clientId"
                [options]="clients"
                formControlName="clientId"
                optionLabel="raisonSociale"
                optionValue="id"
                placeholder="Sélectionner un client"
            ></p-dropdown>
        </div>

        <div class="flex justify-content-end gap-2 mt-4">
            <button pButton type="button" label="Annuler" class="p-button-text" (click)="annuler()"></button>
            <button pButton type="submit" label="Enregistrer" icon="pi pi-check" [loading]="saving"></button>
        </div>
    </form>
</div>
