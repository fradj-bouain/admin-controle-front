<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<p-tabView>
    <p-tabPanel header="Utilisateurs">
        <div class="card">
            <p-toolbar styleClass="mb-4">
                <ng-template pTemplate="right">
                    <button pButton type="button" icon="pi pi-plus" label="Ajouter" routerLink="/configuration/utilisateurs/nouveau"></button>
                </ng-template>
            </p-toolbar>
            <p-table #dtUtilisateurs [value]="utilisateurs" dataKey="id" [paginator]="true" [rows]="10">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Utilisateur</th>
                        <th>Rôles</th>
                        <th>Statut</th>
                        <th style="width: 4rem"></th>
                    </tr>
                    <tr>
                        <th><p-columnFilter type="text" field="username" matchMode="contains" [showMenu]="false" placeholder="Filtrer..."></p-columnFilter></th>
                        <th></th>
                        <th>
                            <p-columnFilter field="actif" matchMode="equals" [showMenu]="false">
                                <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                                    <p-dropdown [ngModel]="value" (ngModelChange)="filter($event)" [options]="[{label: 'Actif', value: true}, {label: 'Inactif', value: false}]" optionLabel="label" optionValue="value" placeholder="Tous" [showClear]="true" [appendTo]="'body'" styleClass="w-full"></p-dropdown>
                                </ng-template>
                            </p-columnFilter>
                        </th>
                        <th></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-utilisateur>
                    <tr>
                        <td>{{ utilisateur.username }}</td>
                        <td>
                            <p-tag *ngFor="let role of utilisateur.roles" [value]="role" class="mr-1"></p-tag>
                        </td>
                        <td><p-tag [severity]="utilisateur.actif ? 'success' : 'danger'" [value]="utilisateur.actif ? 'ACTIF' : 'INACTIF'"></p-tag></td>
                        <td>
                            <button
                                pButton
                                type="button"
                                [icon]="utilisateur.actif ? 'pi pi-ban' : 'pi pi-check'"
                                class="p-button-text p-button-rounded"
                                [pTooltip]="utilisateur.actif ? 'Désactiver' : 'Activer'"
                                (click)="confirmerBasculeStatutUtilisateur(utilisateur)"
                            ></button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </p-tabPanel>

    <p-tabPanel header="Pays">
        <div class="card">
            <p-toolbar styleClass="mb-4">
                <ng-template pTemplate="right">
                    <button pButton type="button" icon="pi pi-plus" label="Ajouter" (click)="ouvrirCreationPays()"></button>
                </ng-template>
            </p-toolbar>
            <p-table #dtPays [value]="pays" dataKey="id" [paginator]="true" [rows]="10">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Code ISO</th>
                        <th>Nom</th>
                        <th>Zone</th>
                        <th style="width: 4rem"></th>
                    </tr>
                    <tr>
                        <th><p-columnFilter type="text" field="codeIso" matchMode="contains" [showMenu]="false" placeholder="Filtrer..."></p-columnFilter></th>
                        <th><p-columnFilter type="text" field="nom" matchMode="contains" [showMenu]="false" placeholder="Filtrer..."></p-columnFilter></th>
                        <th>
                            <p-columnFilter field="zone" matchMode="equals" [showMenu]="false">
                                <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                                    <p-dropdown [ngModel]="value" (ngModelChange)="filter($event)" [options]="[{label: 'France', value: 'FRANCE'}, {label: 'UE', value: 'UE'}, {label: 'Hors UE', value: 'HORS_UE'}]" optionLabel="label" optionValue="value" placeholder="Tous" [showClear]="true" [appendTo]="'body'" styleClass="w-full"></p-dropdown>
                                </ng-template>
                            </p-columnFilter>
                        </th>
                        <th></th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-p>
                    <tr>
                        <td>{{ p.codeIso }}</td>
                        <td>{{ p.nom }}</td>
                        <td>{{ p.zone }}</td>
                        <td>
                            <button pButton type="button" icon="pi pi-pencil" class="p-button-text p-button-rounded" pTooltip="Modifier" (click)="ouvrirEditionPays(p)"></button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </p-tabPanel>

    <p-tabPanel header="Corps de métier">

            </p-toolbar>
            <p-table #dtCorps [value]="corpsDeMetier" dataKey="id" [paginator]="true" [rows]="10">

                    <tr>

                        <th style="width: 4rem"></th>
                    </tr>
                    <tr>

                </ng-template>
                <ng-template pTemplate="body" let-corps>

                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </p-tabPanel>

<app-pays-form-dialog [(visible)]="dialogPaysVisible" [itemToEdit]="paysToEdit" (created)="creerPays($event)" (updated)="modifierPays($event)"></app-pays-form-dialog>
<app-corps-de-metier-form-dialog [(visible)]="dialogCorpsVisible" [itemToEdit]="corpsToEdit" (created)="creerCorpsDeMetier($event)" (updated)="modifierCorpsDeMetier($event)"></app-corps-de-metier-form-dialog>
