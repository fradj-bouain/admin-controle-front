<p-dialog
    [header]="itemToEdit ? 'Modifier le pays' : 'Nouveau pays'"
    [(visible)]="visible"
    (visibleChange)="visibleChange.emit($event)"
    [modal]="true"
    [style]="{ width: '24rem' }"
    (onHide)="close()"
>
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-column gap-3">
        <div class="field">
            <label for="codeIso">Code ISO *</label>
            <input id="codeIso" type="text" pInputText formControlName="codeIso" class="w-full" maxlength="3" [class.ng-dirty]="form.controls.codeIso.touched" />
            <small class="p-error" *ngIf="form.controls.codeIso.invalid && form.controls.codeIso.touched">Ce champ est requis.</small>
        </div>
        <div class="field">
            <label for="nom">Nom *</label>
            <input id="nom" type="text" pInputText formControlName="nom" class="w-full" [class.ng-dirty]="form.controls.nom.touched" />
            <small class="p-error" *ngIf="form.controls.nom.invalid && form.controls.nom.touched">Ce champ est requis.</small>
        </div>
        <div class="field">
            <label for="zone">Zone *</label>
            <p-dropdown id="zone" [options]="zones" formControlName="zone" optionLabel="label" optionValue="value" placeholder="-- Sélectionner --" styleClass="w-full" [class.ng-dirty]="form.controls.zone.touched"></p-dropdown>
            <small class="p-error" *ngIf="form.controls.zone.invalid && form.controls.zone.touched">Ce champ est requis.</small>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <button pButton type="button" label="Annuler" class="p-button-text" (click)="close()"></button>
        <button pButton type="button" label="Enregistrer" (click)="submit()"></button>
    </ng-template>
</p-dialog>
